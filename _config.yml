# Site Settings
title: "Quantum bit"
name: "Quantum bit d.o.o."
masthead_title: "Quantum bit"
description: >-
  Quantum bit d.o.o. is a Split-based engineering company providing software
  development, technical talent sourcing, project management and QA to US and
  European clients, alongside R&D in electronics, software-defined radio and
  rapid prototyping.
url: "https://quantum-bit.net"
baseurl: ""
locale: "en-US"
repository: ""
logo: ""
search: false

# Build Settings
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "dark"

# SEO
twitter:
  username: ""
og_image: "/assets/images/og-quantum-bit.jpg"
social:
  type: Organization
  name: "Quantum bit d.o.o."
  links:
    - "https://amos-bl.com/"

# Site Author
author:
  name: "Quantum bit d.o.o."
  location: "Split, Croatia"

# Footer
copyright: "Quantum bit d.o.o"
copyright_url: "https://quantum-bit.net"
footer:
  since: 2014
atom_feed:
  hide: true

# Reading Files
include:
  - .htaccess
  - _pages

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache
  - .sass-cache
  - .idea
  - .junie
  - _site
  - README.md
  - LICENSE

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Europe/Zagreb

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: splash
      author_profile: false
      sidebar: false
